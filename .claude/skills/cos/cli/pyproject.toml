[project]
name = "cos"
version = "0.1.0"
description = "CLI of the cos (Chief of Staff) skill: batch state, events, gates, waits, ship, cost."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cos = "cos.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
