<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <defs>
    <filter id="inset" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#203c25"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E1E1E; }
    .subtitle { font-size: 12px; fill: #948782; }
    .head { font-size: 10px; font-weight: 700; fill: #948782; letter-spacing: 1.2px; }
    .lbl { font-size: 12px; font-weight: 600; fill: #1E1E1E; }
    .sub { font-size: 10px; fill: #948782; }
    .val { font-size: 12px; font-weight: 700; fill: #1E1E1E; }
    .lever { font-size: 11px; fill: #1E1E1E; }
    .code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; fill: #203c25; }
    .note { font-size: 11px; fill: #7A6B65; }
    .edge { stroke: #203c25; stroke-width: 1.2; fill: none; }
  </style>

  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" class="title">Where the week's $1,374 went, and the lever aimed at each part</text>
  <text x="480" y="50" text-anchor="middle" class="subtitle">Claude Code sessions from 2026-10-19 to 2026-10-26, 668 agents, priced at API rates. Source: the Studio cost report.</text>

  <rect x="20" y="66" width="920" height="290" rx="12" fill="#F5F2F0" stroke="#E0D4CF" stroke-width="1"/>
  <text x="40" y="90" class="head">MEASURED COST DRIVER</text>
  <text x="300" y="90" class="head">SHARE OF THE WEEK</text>
  <text x="610" y="90" class="head">LEVER IN THE SKETCH</text>

  <!-- row 1 -->
  <text x="40" y="122" class="lbl">Long contexts reread every turn</text>
  <text x="40" y="138" class="sub">turns above 200k tokens of context</text>
  <rect x="300" y="110" width="200" height="26" rx="5" fill="#46a758"/>
  <text x="508" y="128" class="val">$546 · 40 %</text>
  <rect x="610" y="102" width="310" height="62" rx="8" fill="#ffffff" stroke="#E0D4CF" stroke-width="0.8" filter="url(#inset)"/>
  <text x="624" y="122" class="lever">crf-build in code replaces the LLM orchestrator</text>
  <text x="624" y="138" class="lever">and the drivers. Main session bounded with</text>
  <text x="624" y="155" class="code">autoCompactWindow: 100000</text>

  <!-- row 2 -->
  <text x="40" y="200" class="lbl">Cache rebuilds after waits</text>
  <text x="40" y="216" class="sub">gaps longer than the 5-minute cache lifetime</text>
  <rect x="300" y="188" width="85" height="26" rx="5" fill="#D4956B"/>
  <text x="393" y="206" class="val">$234 · 17 %</text>
  <rect x="610" y="180" width="310" height="62" rx="8" fill="#ffffff" stroke="#E0D4CF" stroke-width="0.8" filter="url(#inset)"/>
  <text x="624" y="200" class="lever">crf ci wait and crf gate wait outside any LLM,</text>
  <text x="624" y="216" class="lever">so no agent sits idle long enough to expire.</text>
  <text x="624" y="233" class="lever">A one-hour TTL for agents would cost more.</text>

  <!-- row 3 -->
  <text x="40" y="278" class="lbl">Shell reads carried to the end</text>
  <text x="40" y="294" class="sub">cat, sed, grep output kept in coder context</text>
  <rect x="300" y="266" width="65" height="26" rx="5" fill="#C4B5E0"/>
  <text x="373" y="284" class="val">~$180 · ~13 %</text>
  <rect x="610" y="258" width="310" height="62" rx="8" fill="#ffffff" stroke="#E0D4CF" stroke-width="0.8" filter="url(#inset)"/>
  <text x="624" y="278" class="lever">Mostly source code a coder must read. Targeted</text>
  <text x="624" y="294" class="lever">reads and a hand-over note help; test and CI</text>
  <text x="624" y="311" class="lever">output is already short, about 30 lines.</text>

  <text x="40" y="340" class="note">Bars share one scale. The three drivers overlap in part, so their shares do not add up.</text>
  <text x="40" y="380" class="note">The report estimates 30–40 % with model changes; the sketch expects 12–23 % net on 10 days of data. Each lever is measured before it is kept.</text>
</svg>
