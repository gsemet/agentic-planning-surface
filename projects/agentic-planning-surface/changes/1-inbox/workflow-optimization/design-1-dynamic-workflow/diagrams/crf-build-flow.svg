<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.4" fill="#daf1db"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#203c25"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E1E1E; }
    .subtitle { font-size: 12px; fill: #948782; }
    .lane { font-size: 10px; font-weight: 700; fill: #203c25; letter-spacing: 1.2px; }
    .lbl { font-size: 12px; font-weight: 600; }
    .sub { font-size: 9.5px; }
    .dark { fill: #1E1E1E; }
    .light { fill: #ffffff; }
    .elbl { font-size: 10px; fill: #7A6B65; }
    .edge { stroke: #203c25; stroke-width: 1.4; fill: none; }
    .loop { stroke: #203c25; stroke-width: 1.3; fill: none; stroke-dasharray: 6,4; }
  </style>

  <rect width="1000" height="490" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="title">One change request through crf-build, then crf-land</text>
  <text x="500" y="50" text-anchor="middle" class="subtitle">Top lane: LLM agents. Bottom lane: crf, no LLM. Before every step, crf step reads your notes, holds and grants.</text>

  <!-- lanes -->
  <rect x="20" y="70" width="960" height="130" rx="8" fill="#F5F2F0"/>
  <rect x="20" y="210" width="960" height="130" rx="8" fill="url(#dotGrid)" stroke="#E0D4CF" stroke-width="1"/>
  <text x="34" y="96" class="lane">LLM</text>
  <text x="34" y="110" class="lane">AGENTS</text>
  <text x="34" y="236" class="lane">crf CLI</text>
  <text x="34" y="250" class="lane">NO LLM</text>

  <!-- top lane nodes -->
  <rect x="130" y="112" width="115" height="52" rx="7" fill="#2a7e3b"/>
  <text x="187" y="133" text-anchor="middle" class="lbl light">Coder</text>
  <text x="187" y="150" text-anchor="middle" class="sub light">writes hand-over note</text>

  <rect x="385" y="112" width="125" height="52" rx="7" fill="#C4B5E0"/>
  <text x="447" y="133" text-anchor="middle" class="lbl dark">Reviewer</text>
  <text x="447" y="150" text-anchor="middle" class="sub dark">diff + note → verdict</text>

  <rect x="800" y="112" width="150" height="52" rx="7" fill="#D4C4BA"/>
  <text x="875" y="133" text-anchor="middle" class="lbl dark">Conflict fixer</text>
  <text x="875" y="150" text-anchor="middle" class="sub dark">only on a rebase conflict</text>

  <rect x="590" y="112" width="160" height="52" rx="7" fill="#E0D4CF"/>
  <text x="670" y="133" text-anchor="middle" class="lbl dark">Judge</text>
  <text x="670" y="150" text-anchor="middle" class="sub dark">fresh per event, fixed menu</text>

  <!-- bottom lane nodes -->
  <rect x="262" y="252" width="110" height="52" rx="7" fill="#3DBDD6"/>
  <text x="317" y="273" text-anchor="middle" class="lbl dark">crf gate</text>
  <text x="317" y="290" text-anchor="middle" class="sub dark">10–30 lines + exit code</text>

  <rect x="530" y="252" width="110" height="52" rx="7" fill="#3DBDD6"/>
  <text x="585" y="273" text-anchor="middle" class="lbl dark">crf ship</text>
  <text x="585" y="290" text-anchor="middle" class="sub dark">commit · push · PR</text>

  <rect x="660" y="252" width="120" height="52" rx="7" fill="#46a758"/>
  <text x="720" y="273" text-anchor="middle" class="lbl light" font-weight="700">crf ci wait</text>
  <text x="720" y="290" text-anchor="middle" class="sub light">under 10 min, then again</text>

  <rect x="800" y="252" width="150" height="52" rx="7" fill="#3DBDD6"/>
  <text x="875" y="273" text-anchor="middle" class="lbl dark">crf stack</text>
  <text x="875" y="290" text-anchor="middle" class="sub dark">rebase · gh stack · heavy CI</text>

  <!-- main flow -->
  <path d="M220,164 C235,210 255,230 280,250" class="edge" marker-end="url(#arrow)"/>
  <path d="M355,252 C370,220 395,200 415,166" class="edge" marker-end="url(#arrow)"/>
  <path d="M480,164 C500,205 520,225 550,250" class="edge" marker-end="url(#arrow)"/>
  <text x="522" y="196" class="elbl">APPROVE</text>
  <path d="M640,278 L658,278" class="edge" marker-end="url(#arrow)"/>
  <path d="M780,278 L798,278" class="edge" marker-end="url(#arrow)"/>
  <path d="M700,250 L688,166" class="loop" marker-end="url(#arrow)"/>
  <path d="M812,250 L740,166" class="loop" marker-end="url(#arrow)"/>
  <path d="M860,250 L860,166" class="loop" marker-end="url(#arrow)"/>
  <path d="M890,166 L890,250" class="loop" marker-end="url(#arrow)"/>

  <!-- feedback loops -->
  <path d="M447,112 C447,96 187,96 187,110" class="loop" marker-end="url(#arrow)"/>
  <text x="317" y="86" text-anchor="middle" class="elbl">FIX-REQUIRED · new round, 3 rounds at most</text>
  <path d="M720,304 L720,358 L150,358 L150,166" class="loop" marker-end="url(#arrow)"/>
  <text x="435" y="374" text-anchor="middle" class="elbl">product failure in CI · new round (infra failure: retries within a budget, no LLM)</text>

  <!-- after the run -->
  <path d="M875,304 L875,392 L250,392 L250,408" class="edge" marker-end="url(#arrow)"/>
  <rect x="130" y="410" width="185" height="52" rx="7" fill="#E0D4CF"/>
  <text x="222" y="431" text-anchor="middle" class="lbl dark">Run ends</text>
  <text x="222" y="448" text-anchor="middle" class="sub dark">the main session is notified</text>

  <rect x="350" y="410" width="185" height="52" rx="7" fill="#D4956B"/>
  <text x="442" y="431" text-anchor="middle" class="lbl dark">You review and merge</text>
  <text x="442" y="448" text-anchor="middle" class="sub dark">never the agents</text>

  <rect x="570" y="410" width="185" height="52" rx="7" fill="#3DBDD6"/>
  <text x="662" y="431" text-anchor="middle" class="lbl dark">crf wait --merged</text>
  <text x="662" y="448" text-anchor="middle" class="sub dark">background command, /loop as fallback</text>

  <rect x="790" y="410" width="185" height="52" rx="7" fill="#7A6B65"/>
  <text x="882" y="431" text-anchor="middle" class="lbl light">crf-land workflow</text>
  <text x="882" y="448" text-anchor="middle" class="sub light">report · archive · cleanup script</text>

  <path d="M315,436 L348,436" class="edge" marker-end="url(#arrow)"/>
  <path d="M535,436 L568,436" class="edge" marker-end="url(#arrow)"/>
  <path d="M755,436 L788,436" class="edge" marker-end="url(#arrow)"/>
</svg>
