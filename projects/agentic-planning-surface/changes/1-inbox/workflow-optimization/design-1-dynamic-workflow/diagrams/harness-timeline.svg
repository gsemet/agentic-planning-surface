<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330">
  <defs>
    <pattern id="hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#daf1db" stroke-width="1.2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E1E1E; }
    .subtitle { font-size: 12px; fill: #948782; }
    .date { font-size: 10px; font-weight: 700; fill: #7A6B65; }
    .lbl { font-size: 11.5px; font-weight: 600; }
    .sub { font-size: 9.5px; }
    .dark { fill: #1E1E1E; }
    .light { fill: #ffffff; }
    .zone { font-size: 10px; font-weight: 700; fill: #203c25; letter-spacing: 1.2px; }
    .axis { stroke: #203c25; stroke-width: 1.5; }
    .lead { stroke: #948782; stroke-width: 1; }
  </style>

  <rect width="960" height="330" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" class="title">Harness convergence, as documented on 2026-10-27</text>
  <text x="480" y="50" text-anchor="middle" class="subtitle">Dated facts from official changelogs and release notes. The hatched zone holds work with no announced date.</text>

  <rect x="610" y="64" width="330" height="250" rx="8" fill="url(#hatch)" stroke="#E0D4CF" stroke-width="1"/>
  <text x="626" y="84" class="zone">NO DATE ANNOUNCED</text>

  <line x1="30" y1="189" x2="200" y2="189" class="axis"/>
  <path d="M200,189 L207,181 L214,197 L221,189" fill="none" stroke="#203c25" stroke-width="1.5"/>
  <line x1="221" y1="189" x2="600" y2="189" class="axis"/>
  <line x1="600" y1="189" x2="930" y2="189" class="axis" stroke-dasharray="6,4"/>

  <!-- May 28 -->
  <circle cx="90" cy="189" r="6" fill="#7A6B65"/>
  <line x1="90" y1="183" x2="90" y2="150" class="lead"/>
  <text x="90" y="98" text-anchor="middle" class="date">2026-05-28</text>
  <rect x="20" y="104" width="160" height="46" rx="7" fill="#7A6B65"/>
  <text x="100" y="123" text-anchor="middle" class="lbl light">Claude Code 2.1.154</text>
  <text x="100" y="139" text-anchor="middle" class="sub light">dynamic workflows</text>

  <!-- Oct 1 -->
  <circle cx="320" cy="189" r="6" fill="#C4B5E0"/>
  <line x1="320" y1="195" x2="320" y2="228" class="lead"/>
  <rect x="235" y="228" width="170" height="46" rx="7" fill="#C4B5E0"/>
  <text x="320" y="247" text-anchor="middle" class="lbl dark">Copilot CLI · app · SDK</text>
  <text x="320" y="263" text-anchor="middle" class="sub dark">dynamic workflows, public preview</text>
  <text x="320" y="290" text-anchor="middle" class="date">2026-10-01</text>

  <!-- Oct 14 -->
  <circle cx="432" cy="189" r="6" fill="#3DBDD6"/>
  <line x1="432" y1="183" x2="432" y2="150" class="lead"/>
  <text x="432" y="98" text-anchor="middle" class="date">2026-10-14</text>
  <rect x="337" y="104" width="190" height="46" rx="7" fill="#3DBDD6"/>
  <text x="432" y="123" text-anchor="middle" class="lbl dark">VS Code 1.142</text>
  <text x="432" y="139" text-anchor="middle" class="sub dark">Copilot harness on the SDK, rolling out</text>

  <!-- Oct 21 -->
  <circle cx="492" cy="189" r="7" fill="#46a758"/>
  <line x1="492" y1="196" x2="500" y2="228" class="lead"/>
  <rect x="415" y="228" width="180" height="46" rx="7" fill="#46a758"/>
  <text x="505" y="247" text-anchor="middle" class="lbl light">VS Code 1.143</text>
  <text x="505" y="263" text-anchor="middle" class="sub light">Copilot default · Local being retired</text>
  <text x="505" y="290" text-anchor="middle" class="date">2026-10-21</text>

  <!-- today -->
  <line x1="544" y1="170" x2="544" y2="208" stroke="#1E1E1E" stroke-width="1.5"/>
  <text x="544" y="164" text-anchor="middle" class="date">today</text>

  <!-- future -->
  <rect x="640" y="104" width="280" height="46" rx="7" fill="#ffffff" stroke="#203c25" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="780" y="123" text-anchor="middle" class="lbl dark">Copilot SDK v2</text>
  <text x="780" y="139" text-anchor="middle" class="sub dark">tracking issue github/copilot-sdk#2522, breaking API</text>
  <rect x="640" y="228" width="280" height="46" rx="7" fill="#ffffff" stroke="#203c25" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="780" y="247" text-anchor="middle" class="lbl dark">Workflows in the VS Code Copilot harness</text>
  <text x="780" y="263" text-anchor="middle" class="sub dark">SDK has them; no VS Code note or ticket found</text>
</svg>
