<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <defs>
    <filter id="inset" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#203c25"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E1E1E; }
    .subtitle { font-size: 12px; fill: #948782; }
    .hd { font-size: 13px; font-weight: 700; }
    .k { font-size: 10.5px; font-weight: 600; fill: #7A6B65; }
    .v { font-size: 10.5px; fill: #1E1E1E; }
    .code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10px; fill: #203c25; }
    .lbl { font-size: 12px; font-weight: 600; }
    .sub { font-size: 9.5px; }
    .dark { fill: #1E1E1E; }
    .light { fill: #ffffff; }
    .edge { stroke: #203c25; stroke-width: 1.4; fill: none; }
  </style>

  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" class="title">One factory, two harnesses</text>
  <text x="480" y="50" text-anchor="middle" class="subtitle">The workflow body and the crf CLI are written once. Each harness gets a thin adapter.</text>

  <!-- adapter cards -->
  <rect x="20" y="66" width="920" height="178" rx="12" fill="#F5F2F0" stroke="#E0D4CF" stroke-width="1"/>

  <rect x="36" y="80" width="434" height="150" rx="8" fill="#ffffff" stroke="#E0D4CF" stroke-width="0.8" filter="url(#inset)"/>
  <rect x="36" y="80" width="434" height="30" rx="8" fill="#7A6B65"/>
  <rect x="36" y="100" width="434" height="10" fill="#7A6B65"/>
  <text x="52" y="100" class="hd light">Claude Code adapter</text>
  <text x="52" y="132" class="k">Workflow file</text>   <text x="170" y="132" class="code">.claude/workflows/crf-build.js</text>
  <text x="52" y="152" class="k">Mechanical step</text> <text x="170" y="152" class="v">a Haiku agent runs one crf command</text>
  <text x="52" y="172" class="k">Human checkpoint</text><text x="170" y="172" class="v">two workflows: build, then land</text>
  <text x="52" y="192" class="k">Wake-ups</text>        <text x="170" y="192" class="v">/loop · claude -p from cron</text>
  <text x="52" y="212" class="k">Cache</text>           <text x="170" y="212" class="v">main session 1 h; agents 5 min, never idle</text>

  <rect x="490" y="80" width="434" height="150" rx="8" fill="#ffffff" stroke="#E0D4CF" stroke-width="0.8" filter="url(#inset)"/>
  <rect x="490" y="80" width="434" height="30" rx="8" fill="#C4B5E0"/>
  <rect x="490" y="100" width="434" height="10" fill="#C4B5E0"/>
  <text x="506" y="100" class="hd dark">Copilot CLI / SDK adapter</text>
  <text x="506" y="132" class="k">Workflow file</text>   <text x="624" y="132" class="code">.github/extensions/crf-build/extension.mjs</text>
  <text x="506" y="152" class="k">Mechanical step</text> <text x="624" y="152" class="v">ctx.step runs crf, no LLM</text>
  <text x="506" y="172" class="k">Human checkpoint</text><text x="624" y="172" class="v">same two workflows; ctx.pause optional</text>
  <text x="506" y="192" class="k">Wake-ups</text>        <text x="624" y="192" class="v">/loop = /every · copilot workflow run</text>
  <text x="506" y="212" class="k">Cache</text>           <text x="624" y="212" class="v">5 minutes only (copilot-cli#5220)</text>

  <!-- shared body -->
  <path d="M253,244 L253,266" class="edge" marker-end="url(#arrow)"/>
  <path d="M707,244 L707,266" class="edge" marker-end="url(#arrow)"/>
  <rect x="20" y="268" width="920" height="60" rx="8" fill="#46a758"/>
  <text x="480" y="292" text-anchor="middle" class="lbl light" font-weight="700" font-size="13">Shared workflow body · JavaScript</text>
  <text x="480" y="312" text-anchor="middle" class="sub light">agent · pipeline · phase · log · args · output schema · label "cr=137 role=coder round=2"</text>

  <!-- core nodes -->
  <path d="M122,328 L122,354" class="edge" marker-end="url(#arrow)"/>
  <path d="M357,328 L357,354" class="edge" marker-end="url(#arrow)"/>
  <path d="M592,328 L592,354" class="edge" marker-end="url(#arrow)"/>
  <path d="M827,328 L827,354" class="edge" marker-end="url(#arrow)"/>

  <rect x="20" y="356" width="205" height="76" rx="7" fill="#3DBDD6"/>
  <text x="122" y="382" text-anchor="middle" class="lbl dark">crf CLI</text>
  <text x="122" y="400" text-anchor="middle" class="sub dark">uv run · PEP 723 inline metadata</text>
  <text x="122" y="416" text-anchor="middle" class="sub dark">open · gate · ship · ci wait · stack</text>

  <rect x="255" y="356" width="205" height="76" rx="7" fill="#D4C4BA"/>
  <text x="357" y="382" text-anchor="middle" class="lbl dark">CR state + event log</text>
  <text x="357" y="400" text-anchor="middle" class="sub dark">data first; Markdown is generated</text>
  <text x="357" y="416" text-anchor="middle" class="sub dark">every step reads it, so reruns resume</text>

  <rect x="490" y="356" width="205" height="76" rx="7" fill="#2a7e3b"/>
  <text x="592" y="382" text-anchor="middle" class="lbl light">Role cards + schemas</text>
  <text x="592" y="400" text-anchor="middle" class="sub light">coder · reviewer · conflict fixer</text>
  <text x="592" y="416" text-anchor="middle" class="sub light">verdict · hand-over note</text>

  <rect x="725" y="356" width="215" height="76" rx="7" fill="#7A6B65"/>
  <text x="832" y="382" text-anchor="middle" class="lbl light">Measurement</text>
  <text x="832" y="400" text-anchor="middle" class="sub light">copilot-session-usage + Claude reader</text>
  <text x="832" y="416" text-anchor="middle" class="sub light">cost per label · quality guardrails</text>

  <text x="480" y="462" text-anchor="middle" class="subtitle">Skill text (SKILL.md and references) shrinks to the parts an LLM still does: talk, grill, code, review.</text>
</svg>
