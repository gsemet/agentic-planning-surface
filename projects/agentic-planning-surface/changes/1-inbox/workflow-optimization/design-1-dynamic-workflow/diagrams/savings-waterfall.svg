<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <style>
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E1E1E; }
    .subtitle { font-size: 12px; fill: #948782; }
    .axis { font-size: 10px; fill: #948782; }
    .range { font-size: 11.5px; font-weight: 700; fill: #1E1E1E; }
    .lbl { font-size: 10.5px; font-weight: 600; fill: #1E1E1E; }
    .sub { font-size: 10px; fill: #7A6B65; }
    .grid { stroke: #E0D4CF; stroke-width: 1; }
    .conn { stroke: #203c25; stroke-width: 1; stroke-dasharray: 4,3; }
  </style>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" class="title">Expected saving per week, from gross levers to net</text>
  <text x="480" y="50" text-anchor="middle" class="subtitle">Measured 2026-10-20 to 27: about $1,573 a week at API rates. Bars show midpoints; labels show the range.</text>
  <line x1="60" y1="325.0" x2="940" y2="325.0" class="grid"/>
  <line x1="60" y1="250.0" x2="940" y2="250.0" class="grid"/>
  <line x1="60" y1="175.0" x2="940" y2="175.0" class="grid"/>
  <line x1="60" y1="100.0" x2="940" y2="100.0" class="grid"/>
  <text x="54" y="404.0" text-anchor="end" class="axis">$0</text>
  <text x="54" y="329.0" text-anchor="end" class="axis">$100</text>
  <text x="54" y="254.0" text-anchor="end" class="axis">$200</text>
  <text x="54" y="179.0" text-anchor="end" class="axis">$300</text>
  <text x="54" y="104.0" text-anchor="end" class="axis">$400</text>
  <rect x="80" y="271.0" width="90" height="129.0" rx="5" fill="#46a758"/>
  <text x="125" y="264.0" text-anchor="middle" class="range">$160–184</text>
  <line x1="170" y1="271.0" x2="205" y2="271.0" class="conn"/>
  <text x="125" y="420" text-anchor="middle" class="lbl">Orchestrators and</text>
  <text x="125" y="434" text-anchor="middle" class="lbl">drivers become code</text>
  <rect x="205" y="234.6" width="90" height="36.4" rx="5" fill="#3DBDD6"/>
  <text x="250" y="227.6" text-anchor="middle" class="range">$40–57</text>
  <line x1="295" y1="234.6" x2="330" y2="234.6" class="conn"/>
  <text x="250" y="420" text-anchor="middle" class="lbl">No LLM waits</text>
  <text x="250" y="434" text-anchor="middle" class="lbl">in coder rounds</text>
  <rect x="330" y="214.0" width="90" height="20.6" rx="5" fill="#C4B5E0"/>
  <text x="375" y="207.0" text-anchor="middle" class="range">$15–40</text>
  <line x1="420" y1="214.0" x2="455" y2="214.0" class="conn"/>
  <text x="375" y="420" text-anchor="middle" class="lbl">Shorter coder</text>
  <text x="375" y="434" text-anchor="middle" class="lbl">contexts</text>
  <rect x="455" y="150.2" width="90" height="63.8" rx="5" fill="#D4956B"/>
  <text x="500" y="143.2" text-anchor="middle" class="range">$65–105</text>
  <line x1="545" y1="150.2" x2="580" y2="150.2" class="conn"/>
  <text x="500" y="420" text-anchor="middle" class="lbl">Chief of Staff</text>
  <text x="500" y="434" text-anchor="middle" class="lbl">main session</text>
  <rect x="580" y="150.2" width="90" height="15.0" rx="5" fill="#D4C4BA"/>
  <text x="625" y="143.2" text-anchor="middle" class="range">−$10–30</text>
  <line x1="670" y1="165.2" x2="705" y2="165.2" class="conn"/>
  <text x="625" y="420" text-anchor="middle" class="lbl">Overlap</text>
  <text x="625" y="434" text-anchor="middle" class="sub">between levers</text>
  <rect x="705" y="165.2" width="90" height="28.2" rx="5" fill="#7A6B65"/>
  <text x="750" y="158.2" text-anchor="middle" class="range">−$12–63</text>
  <line x1="795" y1="193.4" x2="830" y2="193.4" class="conn"/>
  <text x="750" y="420" text-anchor="middle" class="lbl">Added costs</text>
  <text x="750" y="434" text-anchor="middle" class="sub">runners, rounds, ticks</text>
  <rect x="830" y="193.4" width="90" height="206.6" rx="5" fill="#2a7e3b"/>
  <text x="875" y="186.4" text-anchor="middle" class="range">$185–365</text>
  <text x="875" y="420" text-anchor="middle" class="lbl">Net saving</text>
  <text x="875" y="434" text-anchor="middle" class="sub">12–23 % of the week</text>
  <line x1="60" y1="400" x2="940" y2="400" stroke="#203c25" stroke-width="1.5"/>
  <text x="480" y="466" text-anchor="middle" class="subtitle">Not counted: model changes. A one-hour TTL for agents saves a little today but adds about $87 a week once the levers are in.</text>
</svg>
