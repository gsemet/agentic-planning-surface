<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <style>
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E1E1E; }
    .subtitle { font-size: 12px; fill: #948782; }
    .axis { font-size: 10px; fill: #948782; }
    .range { font-size: 11.5px; font-weight: 700; fill: #1E1E1E; }
    .lbl { font-size: 10.5px; font-weight: 600; fill: #1E1E1E; }
    .sub { font-size: 10px; fill: #7A6B65; }
    .grid { stroke: #E0D4CF; stroke-width: 1; }
    .conn { stroke: #203c25; stroke-width: 1; stroke-dasharray: 4,3; }
  </style>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" class="title">Design 2: expected saving per week</text>
  <text x="480" y="50" text-anchor="middle" class="subtitle">Runs of 2026-10-20 to 27 at official prices: about $1,325 a week. Bars show midpoints; labels show the range.</text>
  <line x1="60" y1="325.0" x2="940" y2="325.0" class="grid"/>
  <line x1="60" y1="250.0" x2="940" y2="250.0" class="grid"/>
  <line x1="60" y1="175.0" x2="940" y2="175.0" class="grid"/>
  <line x1="60" y1="100.0" x2="940" y2="100.0" class="grid"/>
  <text x="54" y="404.0" text-anchor="end" class="axis">$0</text>
  <text x="54" y="329.0" text-anchor="end" class="axis">$100</text>
  <text x="54" y="254.0" text-anchor="end" class="axis">$200</text>
  <text x="54" y="179.0" text-anchor="end" class="axis">$300</text>
  <text x="54" y="104.0" text-anchor="end" class="axis">$400</text>
  <rect x="80" y="323.5" width="90" height="76.5" rx="5" fill="#203c25"/>
  <text x="125" y="316.5" text-anchor="middle" class="range">$84–120</text>
  <line x1="170" y1="323.5" x2="205" y2="323.5" class="conn"/>
  <text x="125" y="420" text-anchor="middle" class="lbl">Foreman and</text>
  <text x="125" y="434" text-anchor="middle" class="lbl">Drivers</text>
  <rect x="205" y="257.9" width="90" height="65.6" rx="5" fill="#D4956B"/>
  <text x="250" y="250.89999999999998" text-anchor="middle" class="range">$70–105</text>
  <line x1="295" y1="257.9" x2="330" y2="257.9" class="conn"/>
  <text x="250" y="420" text-anchor="middle" class="lbl">Chief of Staff</text>
  <text x="250" y="434" text-anchor="middle" class="lbl">main session</text>
  <rect x="330" y="127.0" width="90" height="130.9" rx="5" fill="#2a7e3b"/>
  <text x="375" y="120.0" text-anchor="middle" class="range">$130–219</text>
  <line x1="420" y1="127.0" x2="455" y2="127.0" class="conn"/>
  <text x="375" y="420" text-anchor="middle" class="lbl">Coders, Inspectors,</text>
  <text x="375" y="434" text-anchor="middle" class="lbl">analysts</text>
  <rect x="455" y="127.0" width="90" height="20.6" rx="5" fill="#D4C4BA"/>
  <text x="500" y="120.0" text-anchor="middle" class="range">−$18–37</text>
  <line x1="545" y1="147.6" x2="580" y2="147.6" class="conn"/>
  <text x="500" y="420" text-anchor="middle" class="lbl">Work moved</text>
  <text x="500" y="434" text-anchor="middle" class="sub">to the Foreman</text>
  <rect x="580" y="147.6" width="90" height="11.3" rx="5" fill="#7A6B65"/>
  <text x="625" y="140.6" text-anchor="middle" class="range">−$10–20</text>
  <line x1="670" y1="158.9" x2="705" y2="158.9" class="conn"/>
  <text x="625" y="420" text-anchor="middle" class="lbl">Wake-ups</text>
  <text x="625" y="434" text-anchor="middle" class="sub">for your messages</text>
  <rect x="705" y="158.9" width="90" height="3.0" rx="5" fill="#948782"/>
  <text x="750" y="151.9" text-anchor="middle" class="range">−$3–5</text>
  <line x1="795" y1="161.9" x2="830" y2="161.9" class="conn"/>
  <text x="750" y="420" text-anchor="middle" class="lbl">Foreman</text>
  <text x="750" y="434" text-anchor="middle" class="sub">on Opus</text>
  <rect x="830" y="161.9" width="90" height="238.1" rx="5" fill="#46a758"/>
  <text x="875" y="154.9" text-anchor="middle" class="range">$222–413</text>
  <text x="875" y="420" text-anchor="middle" class="lbl">Net saving</text>
  <text x="875" y="434" text-anchor="middle" class="sub">17–31 % of the week</text>
  <line x1="60" y1="400" x2="940" y2="400" stroke="#203c25" stroke-width="1.5"/>
  <text x="480" y="466" text-anchor="middle" class="subtitle">Not counted: model changes for coders and inspectors, and context caps. Both trade quality for money.</text>
</svg>
