<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="960" height="560" fill="#f4f1ea"/>
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none">
    <rect x="20" y="20" width="450" height="520" rx="14"/>
    <rect x="490" y="20" width="450" height="520" rx="14"/>
  </g>
  <text x="245" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Claude Desktop</text>
  <text x="715" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Copilot, VS Code Agents host</text>


  <!-- Claude column -->
  <g stroke="#4a7bb7" stroke-width="2" fill="#dbe7f5">
    <rect x="95" y="88" width="300" height="70" rx="10"/>
    <rect x="95" y="208" width="300" height="70" rx="10"/>
  </g>
  <g stroke="#46a758" stroke-width="2" fill="#dcefe0">
    <rect x="60" y="328" width="170" height="64" rx="10"/>
    <rect x="260" y="328" width="170" height="64" rx="10"/>
  </g>
  <g stroke="#b7894a" stroke-width="2" fill="#f5e7d3">
    <rect x="60" y="448" width="170" height="64" rx="10"/>
    <rect x="260" y="448" width="170" height="64" rx="10"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="245" y="117" font-weight="bold">Chief of Staff</text>
    <text x="245" y="139" font-size="14">your session, Opus, 1 h cache</text>
    <text x="245" y="237" font-weight="bold">Foreman</text>
    <text x="245" y="259" font-size="14">started by start_session, then detached</text>
    <text x="145" y="356" font-weight="bold">Driver</text>
    <text x="145" y="377" font-size="14">agent file, 1 h cache</text>
    <text x="345" y="356" font-weight="bold">Driver</text>
    <text x="345" y="377" font-size="14">Sonnet, 18k prefix</text>
    <text x="145" y="476" font-weight="bold">Coder</text>
    <text x="145" y="497" font-size="14">5 min cache</text>
    <text x="345" y="476" font-weight="bold">Inspector</text>
    <text x="345" y="497" font-size="14">5 min cache</text>
  </g>

  <!-- Copilot column -->
  <g stroke="#4a7bb7" stroke-width="2" fill="#dbe7f5">
    <rect x="565" y="88" width="300" height="70" rx="10"/>
    <rect x="565" y="208" width="300" height="70" rx="10"/>
  </g>
  <g stroke="#46a758" stroke-width="2" fill="#dcefe0">
    <rect x="530" y="328" width="170" height="64" rx="10"/>
    <rect x="730" y="328" width="170" height="64" rx="10"/>
  </g>
  <g stroke="#b7894a" stroke-width="2" fill="#f5e7d3">
    <rect x="530" y="448" width="170" height="64" rx="10"/>
    <rect x="730" y="448" width="170" height="64" rx="10"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="715" y="117" font-weight="bold">Chief of Staff</text>
    <text x="715" y="139" font-size="14">your chat in the Agents host</text>
    <text x="715" y="237" font-weight="bold">Foreman</text>
    <text x="715" y="259" font-size="14">create_session, Sol, no /every</text>
    <text x="615" y="356" font-weight="bold">Driver</text>
    <text x="615" y="377" font-size="14">task, background</text>
    <text x="815" y="356" font-weight="bold">Driver</text>
    <text x="815" y="377" font-size="14">steered by write_agent</text>
    <text x="615" y="476" font-weight="bold">Coder</text>
    <text x="615" y="497" font-size="14">Luna custom agent</text>
    <text x="815" y="476" font-weight="bold">Inspector</text>
    <text x="815" y="497" font-size="14">Luna, read-only</text>
  </g>

  <!-- arrows -->
  <g stroke="#6b6b6b" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="245" y1="158" x2="245" y2="204"/>
    <line x1="200" y1="278" x2="150" y2="324"/>
    <line x1="290" y1="278" x2="340" y2="324"/>
    <line x1="145" y1="392" x2="145" y2="444"/>
    <line x1="345" y1="392" x2="345" y2="444"/>
    <line x1="715" y1="158" x2="715" y2="204"/>
    <line x1="670" y1="278" x2="620" y2="324"/>
    <line x1="760" y1="278" x2="810" y2="324"/>
    <line x1="615" y1="392" x2="615" y2="444"/>
    <line x1="815" y1="392" x2="815" y2="444"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
